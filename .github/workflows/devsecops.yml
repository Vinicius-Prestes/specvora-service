name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # 1. SECRET SCANNING (TruffleHog & Gitleaks)
  # Detecta credenciais, tokens e strings de conexão expostas no código/histórico
  # =========================================================================
  secret-scanning:
    name: 1. Secret Scanning (TruffleHog & Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # =========================================================================
  # 2. SCA - SOFTWARE COMPOSITION ANALYSIS (Trivy & Snyk) — INFORMATIVO
  # Analisa vulnerabilidades conhecidas (CVEs) nas dependências Maven e publica SARIF
  # =========================================================================
  sca:
    name: 2. SCA - Software Composition Analysis (Trivy & Snyk)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Scan aberto Trivy gerando relatório e SARIF para aba de segurança
      - name: Run Trivy SCA Scanner (pom.xml & FS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Informativo nesta Sprint: publica SARIF sem bloquear (SCA/Container são pesquisa orientada)
          exit-code: '0'

      - name: Upload Trivy SCA SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

      # Executado caso o secret SNYK_TOKEN esteja cadastrado no repositório
      - name: Run Snyk Open Source SCA
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/maven@12140f4059e244892ae643824a95459a102120dd # master (fixado por SHA)
        with:
          args: --severity-threshold=high --fail-on=upgradable

  # =========================================================================
  # 3. SAST - STATIC APPLICATION SECURITY TESTING (Semgrep)
  # Analisa o código Java contra vulnerabilidades (OWASP Top 10, CWE)
  # =========================================================================
  sast:
    name: 3. SAST - Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.90.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep SAST Scan (Java + OWASP Top 10)
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/java" \
            --sarif \
            --output semgrep.sarif \
            --error \
            --verbose

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep-sast'

  # =========================================================================
  # 4. BUILD & AUTOMATED TESTS
  # Compila o projeto com Maven e executa toda a suíte de testes automatizados
  # =========================================================================
  build-and-test:
    name: 4. Build & Automated Tests
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca, sast]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Unit & Security Integration Tests
        run: ./mvnw -B clean verify

      - name: Package JAR
        run: ./mvnw -B package -DskipTests

      - name: Upload Test Reports (Surefire)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Coverage Report (JaCoCo)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specvora-service-jar
          path: target/*.jar
          retention-days: 5

  # =========================================================================
  # 5. CONTAINER SECURITY SCANNING (Trivy Image Scan) — INFORMATIVO
  # Constrói o container Docker multi-stage e inspeciona camadas e SO base
  # =========================================================================
  container-security:
    name: 5. Container Security (Docker + Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker Image (Multi-stage)
        run: |
          docker build -t specvora-service:${{ github.sha }} .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'specvora-service:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Informativo nesta Sprint: publica SARIF sem bloquear (SCA/Container são pesquisa orientada)
          exit-code: '0'

      - name: Upload Trivy Container SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

  # =========================================================================
  # 6. CD - CONTINUOUS DEPLOYMENT (Deploy com Quality Gate)
  # Liberado apenas se TODOS os testes e verificações de segurança passarem
  # =========================================================================
  deploy:
    name: 6. Continuous Deployment (CD com Quality Gate)
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca, sast, build-and-test, container-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Quality Gate Verification
        run: |
          echo "=========================================================="
          echo " DevSecOps Quality Gate aprovado"
          echo " - Secret Scanning (TruffleHog + Gitleaks): sem segredos"
          echo " - SAST (Semgrep): 0 achados"
          echo " - Build & Tests: suíte executada sem falhas"
          echo " - SCA e Container (Trivy): relatórios SARIF publicados"
          echo "=========================================================="

      - name: Deploy to Staging / Production
        run: |
          echo "Iniciando deploy seguro da versão ${{ github.sha }} no ambiente alvo..."
          echo "Deploy homologado com integridade e segurança comprovadas."
