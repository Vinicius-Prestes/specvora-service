name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # 1. SECRET SCANNING (TruffleHog & Gitleaks)
  # Detecta credenciais, tokens e strings de conexão expostas no código/histórico
  # =========================================================================
  secret-scanning:
    name: 1. Secret Scanning (TruffleHog & Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # =========================================================================
  # 2. SCA - SOFTWARE COMPOSITION ANALYSIS (Trivy & Snyk)
  # Analisa vulnerabilidades conhecidas (CVEs) nas dependências Maven
  # =========================================================================
  sca:
    name: 2. SCA - Software Composition Analysis (Trivy & Snyk)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Scan aberto Trivy gerando relatório e SARIF para aba de segurança
      - name: Run Trivy SCA Scanner (pom.xml & FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SCA SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

      # Executado caso o secret SNYK_TOKEN esteja cadastrado no repositório
      - name: Run Snyk Open Source SCA
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/maven@master
        with:
          args: --severity-threshold=high --fail-on=upgradable

  # =========================================================================
  # 3. SAST - STATIC APPLICATION SECURITY TESTING (Semgrep)
  # Analisa o código Java contra vulnerabilidades (OWASP Top 10, CWE)
  # =========================================================================
  sast:
    name: 3. SAST - Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.90.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan (Java + OWASP Top 10)
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/java" \
            --sarif \
            --output semgrep.sarif \
            --error \
            --verbose

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep-sast'

  # =========================================================================
  # 4. IAC SECURITY SCANNING (Trivy Config)
  # Inspeciona Dockerfile e docker-compose.yml contra más práticas de infra
  # =========================================================================
  iac-scan:
    name: 4. IaC Security (Trivy Config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # 5. BUILD & AUTOMATED TESTS
  # Compila o projeto com Maven e executa toda a suíte de testes automatizados
  # =========================================================================
  build-and-test:
    name: 5. Build & Automated Tests
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca, sast, iac-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Unit & Security Integration Tests
        run: ./mvnw -B clean verify

      - name: Package JAR
        run: ./mvnw -B package -DskipTests

      - name: Upload Test Reports (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: specvora-service-jar
          path: target/*.jar
          retention-days: 5

  # =========================================================================
  # 6. CONTAINER SECURITY SCANNING (Trivy Image Scan)
  # Constrói o container Docker multi-stage e inspeciona camadas e SO base
  # =========================================================================
  container-security:
    name: 6. Container Security (Docker + Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image (Multi-stage)
        run: |
          docker build -t specvora-service:${{ github.sha }} .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'specvora-service:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # =========================================================================
  # 7. CD - CONTINUOUS DEPLOYMENT (Deploy com Quality Gate)
  # Liberado apenas se TODOS os testes e verificações de segurança passarem
  # =========================================================================
  deploy:
    name: 7. Continuous Deployment (CD com Quality Gate)
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca, sast, iac-scan, build-and-test, container-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Quality Gate Verification
        run: |
          echo "=========================================================="
          echo " DevSecOps Quality Gate: APROVADO COM SUCESSO!"
          echo " - Secret Scanning: Aprovado sem segredos"
          echo " - SCA (Dependências): Aprovado (CVEs verificadas e SARIF publicado)"
          echo " - SAST (Código Java): Aprovado (regras OWASP Top 10 verificadas)"
          echo " - IaC (Infraestrutura): Dockerfile e Docker Compose validados"
          echo " - Build & Tests: 100% dos testes executados com sucesso"
          echo " - Container Security: Imagem Docker inspecionada"
          echo "=========================================================="

      - name: Deploy to Staging / Production
        run: |
          echo "Iniciando deploy seguro da versão ${{ github.sha }} no ambiente alvo..."
          echo "Deploy homologado com integridade e segurança comprovadas."
