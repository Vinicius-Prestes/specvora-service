services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://specvora:fiap@mongo:27017/specvora?authSource=admin
      - JWT_SECRET=specvora-devsecops-super-secret-jwt-key-for-fiap-2026-rotacionada
    depends_on:
      - mongo
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=specvora
      - MONGO_INITDB_ROOT_PASSWORD=fiap
    ports:
      - "27017:27017"
    restart: unless-stopped
