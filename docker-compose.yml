services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://specvora:***REMOVED***@mongo:27017/specvora?authSource=admin
      - JWT_SECRET=***REMOVED***
    depends_on:
      - mongo
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=specvora
      - MONGO_INITDB_ROOT_PASSWORD=***REMOVED***
    ports:
      - "27017:27017"
    restart: unless-stopped
