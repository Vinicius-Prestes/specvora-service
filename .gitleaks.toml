# Configuração Gitleaks para detecção de secrets no Specvora Service
title = "Specvora Service Gitleaks Configuration"

[extend]
# Estende as regras padrão do Gitleaks (mais de 150 regras conhecidas)
useDefault = true

# Allowlist mínima: apenas artefatos gerados. Código-fonte, pom.xml e scripts
# continuam sendo inspecionados. Falsos-positivos pontuais vão em .gitleaksignore
# (fingerprint commit:arquivo:regra:linha), nunca por caminho ou regex genérico.
[allowlist]
description = "Artefatos de build (não versionados)"
paths = [
  '''(^|/)target/'''
]

# Regra personalizada para proteger Service Account Keys do Firebase / Google Cloud
[[rules]]
id = "firebase-service-account-private-key"
description = "Firebase/GCP Service Account Private Key detected"
regex = '''"private_key":\s*"-----BEGIN PRIVATE KEY-----[A-Za-z0-9+\/=\s]+-----END PRIVATE KEY-----"'''
secretGroup = 0
keywords = [
  "private_key",
  "BEGIN PRIVATE KEY"
]

# Regra personalizada para strings de conexão MongoDB com credenciais reais
# (a lookahead ignora placeholders ${VAR} usados no docker-compose.yml)
[[rules]]
id = "mongodb-connection-string-with-credentials"
description = "MongoDB connection string with credentials"
regex = '''mongodb(?:\+srv)?:\/\/[a-zA-Z0-9_\-\.]+:[^@\s$]+@[a-zA-Z0-9_\-\.]+'''
secretGroup = 0
keywords = [
  "mongodb://",
  "mongodb+srv://"
]

# Segredos JWT/AES atribuídos diretamente em arquivos de configuração
[[rules]]
id = "hardcoded-jwt-or-aes-secret"
description = "JWT_SECRET / AES_SECRET com valor literal"
regex = '''(?i)(JWT_SECRET|AES_SECRET)\s*[=:]\s*[^\s$\{]{16,}'''
secretGroup = 0
keywords = ["jwt_secret", "aes_secret"]
