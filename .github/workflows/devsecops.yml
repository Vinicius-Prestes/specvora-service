name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # 1. SECRET SCANNING (Gitleaks & GitGuardian)
  # Detecta credenciais, tokens do Firebase e strings de conexão expostas
  # =========================================================================
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para escanear todo o histórico de commits

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # =========================================================================
  # 2. SCA - SOFTWARE COMPOSITION ANALYSIS (Snyk & Trivy)
  # Analisa vulnerabilidades conhecidas (CVEs) nas dependências Maven (pom.xml)
  # =========================================================================
  sca:
    name: 2. SCA - Software Composition Analysis (Snyk & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Verificação com Trivy (100% open-source, sem necessidade de token prévio)
      - name: Run Trivy SCA Scanner (pom.xml & FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # Alerta no terminal sobre CVEs de alta criticidade
          severity: 'CRITICAL,HIGH'

      # Verificação com Snyk CLI (executado caso o secret SNYK_TOKEN esteja configurado)
      - name: Run Snyk Open Source SCA
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable

  # =========================================================================
  # 3. SAST - STATIC APPLICATION SECURITY TESTING (Semgrep)
  # Analisa o código-fonte Java em busca de falhas (OWASP Top 10, Injeções, etc.)
  # =========================================================================
  sast:
    name: 3. SAST - Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan (Java + OWASP Top 10)
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/java" \
            --error \
            --verbose

  # =========================================================================
  # 4. BUILD & TEST
  # Compila o projeto com Maven e executa a suíte de testes unitários
  # =========================================================================
  build-and-test:
    name: 4. Build & Automated Tests
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca, sast] # Executado após passar pelos gates de código
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile and Test
        run: ./mvnw -B clean test-compile test

      - name: Package JAR
        run: ./mvnw -B package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: specvora-service-jar
          path: target/*.jar
          retention-days: 5

  # =========================================================================
  # 5. CONTAINER SECURITY SCANNING (Trivy Docker Scan)
  # Constrói o container Docker da aplicação e inspeciona camadas do SO/base image
  # =========================================================================
  container-security:
    name: 5. Container Security (Docker + Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: specvora-service-jar
          path: target

      - name: Build Docker Image
        run: |
          docker build -t specvora-service:${{ github.sha }} .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'specvora-service:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # 6. CD - CONTINUOUS DEPLOYMENT (Deploy com Quality Gate)
  # Liberado apenas se TODOS os testes e verificações de segurança passarem
  # =========================================================================
  deploy:
    name: 6. Continuous Deployment (CD com Quality Gate)
    runs-on: ubuntu-latest
    needs: [secret-scanning, sca, sast, build-and-test, container-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Quality Gate Verification
        run: |
          echo "=========================================================="
          echo " DevSecOps Quality Gate: APROVADO COM SUCESSO!"
          echo " - Secret Scanning: Nenhuma credencial exposta"
          echo " - SCA: Dependências aprovadas (sem CVEs críticas)"
          echo " - SAST: Código fonte validado contra OWASP Top 10"
          echo " - Build & Tests: Compilação e testes unitários concluídos"
          echo " - Container Security: Imagem Docker inspecionada"
          echo "=========================================================="

      - name: Deploy to Production / Staging Environment
        run: |
          echo "Iniciando deploy seguro da versão ${{ github.sha }}..."
          # Exemplo de comando de deploy:
          # aws ecr push / kubectl apply / azure webapp deploy
          echo "Deploy concluído com integridade e segurança garantidas."
